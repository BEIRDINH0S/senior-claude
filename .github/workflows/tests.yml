name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests de chaque plugin
        run: |
          set -e
          for t in plugins/*/tests; do
            echo "::group::$t"
            python -m unittest discover -s "$t" -v
            echo "::endgroup::"
          done
      - name: "ops-doc : l'exemple de référence est conforme"
        run: |
          E=plugins/ops-doc/skills/ops-doc/references/exemple-rdv
          python plugins/ops-doc/skills/ops-doc/scripts/check_docs.py $E --docs $E --manifests $E/adr
