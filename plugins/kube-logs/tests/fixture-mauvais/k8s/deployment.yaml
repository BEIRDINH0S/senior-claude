apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdv-api
spec:
  template:
    spec:
      containers:
        - name: api
          image: rdv-api:1.0.0
          volumeMounts:
            - name: logs
              mountPath: /var/log/app
        - name: log-shipper
          image: busybox
          args: ["/bin/sh", "-c", "tail -F /var/log/app/app.log"]
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: rdv-logs
