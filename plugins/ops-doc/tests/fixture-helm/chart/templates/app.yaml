apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  template:
    spec:
      containers:
        - name: demo
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: demo-pg-app, key: uri } }
            - { name: S3_ENDPOINT, value: "http://garage:3900" }
            - { name: LOG_LEVEL, value: {{ .Values.app.logLevel | quote }} }
            - name: JETON
              valueFrom: { secretKeyRef: { name: {{ .Values.app.secret }}, key: jeton } }
            - name: RPC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.garage.secret }}
                  key: rpc
            - name: INCONNU
              valueFrom: { secretKeyRef: { name: {{ include "demo.secret" . }}, key: x } }
